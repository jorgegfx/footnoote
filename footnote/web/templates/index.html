<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Footnote</title>
  <meta name="description" content="Answers from trusted news sources, with citations.">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}?v={{ version }}">
</head>
<body>
  <main class="page">
    <header class="masthead">
      <h1 class="brand">Footnote</h1>
      <p class="tagline">Answers from trusted news sources. Every claim is cited.</p>
    </header>

    <form id="search" class="search" autocomplete="off">
      <label class="visually-hidden" for="q">Your question</label>
      <div class="search-row">
        <input id="q" name="q" type="search" minlength="3" maxlength="500" required
               placeholder="Ask a question, e.g. What did the Fed decide at its last meeting?">
        <button type="submit" id="submit">Search</button>
      </div>
    </form>

    <p id="notice" class="notice" role="alert" hidden></p>

    <section id="progress" class="progress" hidden aria-live="polite">
      <p id="phase" class="phase"></p>
      <ul id="queries" class="queries"></ul>
      <ul id="source-status" class="source-status"></ul>
    </section>

    <section id="answer-section" class="answer-section" hidden>
      <h2 class="section-title">Answer <span id="draft-label" class="draft-label" hidden>draft · checking citations</span></h2>
      <div id="answer" class="answer"></div>
      <p id="answer-meta" class="answer-meta"></p>
    </section>

    <section id="sources-section" class="sources-section" hidden>
      <h2 class="section-title">Sources</h2>
      <ol id="sources" class="sources"></ol>
    </section>
  </main>

  <footer class="footer">Footnote v{{ version }} · retrieved text is shown as found; check the sources for context.</footer>
  <script src="{{ url_for('static', path='app.js') }}?v={{ version }}"></script>
</body>
</html>
