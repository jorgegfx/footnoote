# Trusted sources. Every adapter is registered by `id` (native) or covered by the
# domain-restricted web search (search). Edit trust weights and toggles here; no code changes needed.
#
#   family: news
#   kind:   native (dedicated API adapter) | search (web search restricted to `domains`)
#   trust:  0–1, multiplied into the ranking score
#   rate_limit_per_sec: the provider's published limit, enforced per process

sources:
  # --- News: native APIs ---
  - id: guardian
    family: news
    kind: native
    trust: 0.85
    rate_limit_per_sec: 1        # needs GUARDIAN_API_KEY
  - id: nyt
    family: news
    kind: native
    trust: 0.85
    rate_limit_per_sec: 0.08     # 5/minute; needs NYT_API_KEY
  - id: gdelt
    family: news
    kind: native
    # Off: from this network GDELT takes 10-12s per reply (over ADAPTER_TIMEOUT_SECONDS) and
    # answers with 429 even when requests are spaced well apart. Re-enable if that improves.
    enabled: false
    trust: 0.8                   # capped by the matched outlet's own trust
    rate_limit_per_sec: 0.2      # one request per 5 seconds

  # --- News: domain-restricted search ---
  - id: reuters
    family: news
    kind: search
    domains: [reuters.com]
    trust: 0.95
  - id: apnews
    family: news
    kind: search
    domains: [apnews.com]
    trust: 0.95
  - id: bbc
    family: news
    kind: search
    domains: [bbc.com, bbc.co.uk]
    trust: 0.9
  - id: npr
    family: news
    kind: search
    domains: [npr.org]
    trust: 0.9
  - id: guardian_web
    family: news
    kind: search
    domains: [theguardian.com]
    trust: 0.85
  - id: nytimes_web
    family: news
    kind: search
    domains: [nytimes.com]
    trust: 0.85
  - id: wsj
    family: news
    kind: search
    domains: [wsj.com]
    trust: 0.85
  - id: ft
    family: news
    kind: search
    domains: [ft.com]
    trust: 0.85
  - id: economist
    family: news
    kind: search
    domains: [economist.com]
    trust: 0.85
  - id: bloomberg
    family: news
    kind: search
    domains: [bloomberg.com]
    trust: 0.85

